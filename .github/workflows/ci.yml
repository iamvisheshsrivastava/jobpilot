name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Report-only: the repo currently carries a batch of pre-existing
      # no-unused-vars / no-explicit-any findings across several files with
      # no functional impact. A hard-fail gate here would be permanently red
      # today. Revisit continue-on-error once that backlog is cleared and
      # this can block merges for real (mirrors the same call made for
      # npm audit in security.yml).
      - name: Lint
        continue-on-error: true
        run: npm run lint
